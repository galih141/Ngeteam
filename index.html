<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Limits where this page can send data. If you add a provider host in ALLOWED_HOSTS, add it here too. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://api.anthropic.com https://generativelanguage.googleapis.com https://api.x.ai https://api.groq.com https://openrouter.ai; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Studio Board</title>
<meta name="description" content="Console for a one-person 3D studio run with an AI team.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --clay:#e3e5e8;          /* page background, unlit clay render */
  --plaster:#f4f5f6;       /* panels */
  --ink:#1d2026;
  --graphite:#586070;
  --line:#cdd1d7;
  --agency:#f26a1b;        /* selection orange */
  --agency-text:#b8480a;
  --creative:#2386d6;      /* viewport blue */
  --creative-text:#17639f;
  --danger:#b3261e;
  --ok:#1f7a4d;
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--clay);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;line-height:1.15}
h1{font-size:28px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--graphite)}
.small{font-size:13px}

/* layout */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.outliner{background:var(--plaster);border-right:1px solid var(--line);padding:18px 12px 20px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.main{padding:0 32px 64px;min-width:0}

/* outliner */
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font:700 17px var(--f-display)}
.brand svg{flex:none}
.tree{display:flex;flex-direction:column;gap:2px}
.node{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:6px;padding:6px 8px;line-height:1.25}
.node:hover{background:#e9ebee}
.node small{margin-left:auto;color:var(--graphite);font-size:12px}
.node.sel{background:#fff;border-color:var(--ink)}
.node.sel.agency{border-color:var(--agency)}
.node.sel.creative{border-color:var(--creative)}
.children{margin-left:15px;padding-left:10px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ink)}
.dot.agency{background:var(--agency)}
.dot.creative{background:var(--creative)}
.cube{width:14px;height:14px;flex:none;border:2px solid var(--ink);border-radius:3px;transform:rotate(45deg) scale(.8)}
.group-title{padding:0 8px;font:700 13px var(--f-display);color:var(--graphite)}
.team-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.team-list .node span.t{color:var(--graphite);font-size:12px;margin-left:auto}
.data-links{margin-top:auto;display:flex;gap:12px;flex-wrap:wrap;padding:0 8px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--graphite);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -32px 28px;padding:0 32px;position:sticky;top:0;background:var(--clay);z-index:5;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:16px 12px 11px;font-weight:500;color:var(--graphite);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.scope{margin-left:auto;align-self:center;font-size:13px;color:var(--graphite);white-space:nowrap;padding-left:16px}

/* generic */
.vh{margin-bottom:22px;max-width:720px}
.vh p{margin-top:8px;color:var(--graphite)}
.panel{background:var(--plaster);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel+.panel{margin-top:16px}
.panel>h2{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.stack .panel+.panel{margin-top:0}
.banner{background:#fff;border:1px dashed var(--graphite);border-radius:10px;padding:12px 14px;margin-bottom:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{flex:1;min-width:220px}

.btn{border:1px solid var(--ink);background:transparent;border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{background:#fff}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.sm{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.35;cursor:default}
.btn.danger{border-color:var(--danger);color:var(--danger)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;font-weight:500;color:var(--graphite)}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 2px rgba(29,32,38,.15)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;margin-bottom:20px}
.form-row .wide{grid-column:span 2}
.form-row.stackform{grid-template-columns:1fr 1fr}
.form-row.stackform .full{grid-column:1/-1}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:1px 9px 1px 7px;border-radius:99px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.tag.agency{color:var(--agency-text);border-color:rgba(242,106,27,.45)}
.tag.creative{color:var(--creative-text);border-color:rgba(35,134,214,.45)}
.tag .dot{width:8px;height:8px}

/* lists */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:0}
.rows .grow{flex:1;min-width:0}
.rows .when{font-size:13px;color:var(--graphite);white-space:nowrap}
.rows .when.late{color:var(--danger);font-weight:600}
.empty{color:var(--graphite);padding:6px 0}

/* limit watch */
.lim{padding:12px 0;border-top:1px solid var(--line)}
.lim:first-of-type{border-top:0;padding-top:4px}
.lim-top{display:flex;align-items:center;gap:10px}
.lim-top b{font-family:var(--f-display)}
.lim-top .push{margin-left:auto;display:flex;gap:6px}
.meter{height:8px;border-radius:99px;background:#dfe2e6;margin:9px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.meter i.hot{background:var(--danger)}
.lim-set{display:flex;gap:10px;margin-top:8px}
.lim-set label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--graphite)}
.lim-set input{width:64px;padding:3px 6px}

/* team */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.role{background:var(--plaster);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.role-head{display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 18px var(--f-display);color:#fff;flex:none}
.role-head .models{margin-left:auto;text-align:right;font-size:12.5px;color:var(--graphite);line-height:1.35}
.quote{font-style:italic;color:var(--graphite)}
.kv{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--graphite)}
.kv dd{margin:0}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;font-size:13px}
.skill:hover{border-color:var(--ink)}
.role-foot{margin-top:auto;display:flex;gap:8px}

/* board */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#d9dce0;border-radius:10px;padding:10px;min-height:160px}
.col>h3{display:flex;justify-content:space-between;padding:2px 4px 10px;font-size:14px}
.col>h3 span{color:var(--graphite);font-weight:500}
.task{background:var(--plaster);border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.task.agency{border-left-color:var(--agency)}
.task.creative{border-left-color:var(--creative)}
.task .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--graphite)}
.task .meta .late{color:var(--danger);font-weight:600}
.task .ctl{display:flex;gap:6px}
.task .ctl .spacer{margin-left:auto}

/* money */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:20px}
.sum h2{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sum dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:5px 12px}
.sum dt{color:var(--graphite)}
.sum dd{margin:0;text-align:right;font-weight:500}
.sum .keep{border-top:1px solid var(--line);padding-top:7px;margin-top:4px;color:var(--ink);font-weight:700}
.sum dd.keep{font-family:var(--f-display);font-size:17px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--plaster)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;font-weight:600;color:var(--graphite);font-size:13px;background:#eceef0}
td.num,th.num{text-align:right}
.in{color:var(--ok)}
.out{color:var(--ink)}
.stat{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 10px;font-size:13px}
.stat.Due{border-color:var(--agency);color:var(--agency-text)}
.stat.Received{border-color:var(--ok);color:var(--ok)}

/* decisions */
.dec{background:var(--plaster);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.dec+.dec{margin-top:12px}
.dec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dec-head .date{color:var(--graphite);font-size:13px}
.dec-head .push{margin-left:auto}
.dec dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:3px 10px;font-size:14px}
.dec dt{color:var(--graphite)}
.dec dd{margin:0}

/* ai button, status dots, modal */
.tabs-right{margin-left:auto;display:flex;align-items:center;gap:14px;padding-left:12px;position:sticky;right:0;background:var(--clay)}
.tabs-right .scope{margin-left:0;padding-left:0}
.ai-btn{display:flex;align-items:center;gap:8px;background:var(--plaster);border:1px solid var(--ink);border-radius:99px;padding:5px 14px 5px 11px;margin:7px 0;white-space:nowrap}
.ai-btn:hover{background:#fff}
.ai-btn b{font-family:var(--f-display)}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;background:#a2a8b3;border:1px solid rgba(0,0,0,.18)}
.sdot.ok{background:#1fa463;border-color:#1a8a53}
.sdot.fail{background:var(--danger);border-color:var(--danger)}
.sdot.warn{background:#e0a11b;border-color:#b98211}
.sdot.testing,.sdot.busy{background:var(--creative);border-color:var(--creative);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.overlay{position:fixed;inset:0;background:rgba(20,22,26,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:20}
.overlay.open{display:flex}
.sheet{background:var(--plaster);border-radius:12px;width:min(820px,100%);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.sheet-head .push{margin-left:auto}
.sheet-head p{margin-top:4px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.keyin{display:flex;gap:8px}
.keyin input{flex:1}
.kfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kfoot .push,.out-foot .push{margin-left:auto}
.kstat{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--graphite);min-width:0;flex:1 1 220px}
.kstat .sdot{margin-top:5px}
.kstat span{overflow-wrap:anywhere}
.assign{display:flex;flex-direction:column}
.arow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.arow:first-child{border-top:0}
.arow .grow{flex:1 1 150px;min-width:0}
.arow select{width:auto;max-width:270px;flex:0 1 270px}
.arow .uses{flex:1 1 100%;margin-left:40px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.notes{margin:16px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* chat */
.chat{display:grid;grid-template-columns:236px minmax(0,1fr);gap:18px;align-items:start}
.clist{display:flex;flex-direction:column;gap:2px;position:sticky;top:72px}
.clist .group-title{padding:8px 8px 4px}
.seg{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;margin:0 0 8px}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.citem{display:flex;align-items:center;gap:8px;text-align:left;width:100%;border:2px solid transparent;background:none;border-radius:6px;padding:6px 8px;line-height:1.25}
.citem:hover{background:#e9ebee}
.citem.on{background:#fff;border-color:var(--ink)}
.citem .n{width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid var(--graphite);display:grid;place-items:center;font-size:12px;color:var(--graphite)}
.citem.on .n{border-color:var(--ink);color:var(--ink)}
.wait{margin-left:auto;font-size:12px;background:var(--ink);color:#fff;border-radius:99px;padding:0 8px;white-space:nowrap}
.thread{background:var(--plaster);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.th-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.th-head .titles{flex:1;min-width:200px}
.th-head input{border-color:transparent;background:transparent;font:700 18px var(--f-display);padding:3px 6px;margin-left:-6px}
.th-head input:hover{border-color:var(--line)}
.faces{display:flex}
.faces .avatar+.avatar{margin-left:-6px}
.avatar.sm{width:30px;height:30px;border-radius:9px;font-size:14px;border:2px solid var(--plaster)}
.msgs{display:flex;flex-direction:column;gap:14px;padding:16px;overflow-y:auto;min-height:240px;max-height:52vh}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:column;align-items:flex-end}
.msg .body{min-width:0}
.bub{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 12px;line-height:1.5;overflow-wrap:anywhere}
.msg.me .bub{background:var(--ink);color:#fff;border-color:var(--ink);border-radius:14px 4px 14px 14px;text-align:left}
.mm{font-size:12.5px;color:var(--graphite);margin-bottom:3px}
.mm b{color:var(--ink);margin-right:6px}
.mm .via{margin-left:8px;font-size:12px}
.msg.me .mm{text-align:right}
.macts{display:flex;gap:12px;margin-top:3px}
.empty-chat{color:var(--graphite);max-width:520px;margin:auto;text-align:center;padding:20px 0}
.tray{border-top:1px solid var(--line);padding:12px 0 2px;background:#eceef0}
.tray:empty{display:none}
.tray>p{padding:0 16px 8px}
.pend{border:1px dashed var(--c,var(--graphite));border-radius:10px;background:#fff;padding:12px;margin:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.pend.loading{border-style:solid}
.pend.error{border-color:var(--danger)}
.pend-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pend-h .push{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.askrow{display:flex;gap:6px;align-items:center}
.askrow select{width:auto;max-width:210px;padding:3px 6px;font-size:13px}
.pend details summary{cursor:pointer;font-size:13px;color:var(--graphite)}
.pend pre{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--plaster);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:240px;overflow:auto;margin:8px 0 0}
.acts{margin-top:6px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.acts-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.acts ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.acts li{font-size:14px;overflow-wrap:anywhere}
.acts-f{display:flex;gap:8px;flex-wrap:wrap}
.acts-f:empty{display:none}
.tag.okay{color:var(--ok);border-color:rgba(31,122,77,.5)}
.composer{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.comp-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px}
.composer textarea{min-height:76px}
.pset{font-size:13px;color:var(--graphite)}
.pset summary{cursor:pointer}
.pset .checks{margin:8px 0 0}
.pset .field{max-width:220px;margin-top:8px}
.stepedit{margin:12px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.stepedit fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0}
.stepedit legend{font-size:13px;color:var(--graphite);padding:0 4px}
.chk{display:flex;align-items:flex-start;gap:6px;font-size:14px}
.chk input{width:auto;margin-top:3px}
.checks{display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 14px;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
.checks input{width:auto}
.out-foot{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
.warn{color:var(--danger)}


/* avatars */
.avatar{position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.avatar.has-img .ini{visibility:hidden}
.avatar.lg{width:56px;height:56px;border-radius:16px;font-size:24px}
.avatar.xs{width:22px;height:22px;border-radius:7px;font-size:11px}
.avatar.sm{width:32px;height:32px}
.avatar .ini{line-height:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:40;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .outliner{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .team-list{flex-direction:row;flex-wrap:wrap}
  .team-list .node{width:auto}
  .team-list .node span.t{display:none}
  .main{padding:0 16px 56px}
  .tabs{margin:0 -16px 22px;padding:0 16px}
  .grid2{grid-template-columns:1fr}
  .chat{grid-template-columns:1fr}
  .clist{position:static}
  .comp-row{grid-template-columns:1fr}
  .scope{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.avatar.sm{width:44px;height:44px;border-radius:12px;font-size:19px}
.avatar.lg{width:88px;height:88px;border-radius:22px;font-size:36px}
.avatar.xs{width:28px;height:28px;border-radius:8px;font-size:13px}

function mstats(div) {
  const rows = state.money.filter(m => m.division === div);
  const sum = f => rows.filter(f).reduce((a, m) => a + (Number(m.amount) || 0), 0);
  const inc = m => m.type === 'income', exp = m => m.type === 'expense';
  const r = {
    received: sum(m => inc(m) && m.status === 'Received'),
    due: sum(m => inc(m) && m.status === 'Due'),
    expected: sum(m => inc(m) && m.status === 'Expected'),
    paid: sum(m => exp(m) && m.status === 'Received'),
    unpaid: sum(m => exp(m) && m.status !== 'Received')
  };
  const cuts = rows.filter(m => inc(m) && m.status === 'Received').flatMap(m => m.cuts || []);
  r.cuts = cuts.reduce((a, c) => a + (Number(c.amount) || 0), 0);
  r.cutsOwed = cuts.filter(c => !c.paid).reduce((a, c) => a + (Number(c.amount) || 0), 0);
  r.kept = r.received - r.paid - r.cuts;
  return r;
}
function whenText(due) {

}
function applyAvatars() {
  document.querySelectorAll('.avatar[data-av]').forEach(el => {
    const u = AV[el.dataset.av]; if (!u || el.querySelector('img')) return;
    const im = document.createElement('img'); im.src = u; im.alt = ''; im.decoding = 'async'; im.draggable = false;
    el.appendChild(im); el.classList.add('has-img');
  });
}
function probeAvatar(r) {
  return new Promise(res => {
    const list = avUrls(r); let i = 0;
    const next = () => {
      if (i >= list.length) { AV[r.id] = ''; res(); return; }
      const im = new Image(), url = list[i];
      im.onload = () => { AV[r.id] = url; res(); };
      im.onerror = () => { i++; next(); };
      im.src = url;
    };
    next();
  });
}
async function probeAvatars() { await Promise.all(ROLES.map(probeAvatar)); applyAvatars(); }

    const week = open.filter(t => t.due && diff(t.due) >= 0 && diff(t.due) <= 7);
    const out = ['WORKLOAD CHECK:'];
    if (h && d) {
      let biz = 0; const t0 = new Date(); for (let i = 1; i <= d; i++) { const x = new Date(t0); x.setDate(t0.getDate() + i); const w = x.getDay(); if (w !== 0 && w !== 6) biz++; }
      biz = Math.max(biz, 1);
      const per = h / biz;
      out.push(`${r1(h)} hours in ${d} calendar days leaves about ${biz} working days (weekends skipped).`, `That is ${r1(per)} hours a day.${per > 6 ? ' Too tight. Ask for more time or cut the scope.' : per > 4 ? ' Doable, but nothing else fits beside it.' : ' Comfortable.'}`);
      out.push(`That is about ${r1(per * 5)} hours of your week.${cap ? ` For comparison, your Studio brain notes ${cap} focused hours a week for your own work.` : ''}`);
    } else {
      out.push(h || d ? 'Send both hours and days, for example "30 hours in 10 days".' : 'Send the hours and the days you have, for example "30 hours in 10 days", and I check if it fits.');
    }
    out.push(`\nOn the board now: ${open.length} open tasks, ${week.length} due in the next 7 days.`);
    if (week.length > 4) out.push('That is a lot for one week. Pick the two that matter and move the rest.');
    return out.join('\n');
  }

  /* ---- 6. checklists with a score ---- */
  const CHECKS = {
    go: { title: 'Go / No-Go: should I take this job?', qs: [
      'Is the brief clear enough that I know what "done" looks like?',
      'Does the price cover my hours at my normal rate?',
      'Is the deadline realistic with my other work?',
      'Are the revision rounds limited and written down?',
      'Will the client pay a deposit before I start?',
      'Is there one person who approves the work?',
      'Do I want this in my portfolio or want this client again?',
      'Do I have every tool, asset and file I need?'] },
    deliver: { title: 'Delivery check: before sending the final files', qs: [
      'Does every item match the approved brief?',
      'Did I fix every point from the last feedback?',
      'Are file names, formats and sizes what was agreed?',
      'Did I check the files open on a clean device?',
      'Is the deposit paid and the final invoice ready?',
      'Do I have a backup of the source files?',
      'Does my message say what is included and what a new change costs?'] },
    intake: { title: 'Client intake: new inquiry', qs: [
      'Do I know what the final output is (images, video, models)?',

      'Do I know the deadline and what is fixed about it?',
      'Do I know the budget range?',

      'Did I say how many revision rounds are included?'] },
    launch: { title: 'Product launch: before publishing a pack', qs: [
      'Is every asset tested and named properly?',

      'Are the title, description and tags written?',
      'Do I have at least 5 good preview images?',

      'Is the payout date and platform fee noted in Money?'] },
    scope: { title: 'Scope change: client asks for more', qs: [
      'Is this outside what the quote lists?',
      'Did I tell the client it is extra before doing it?',
      'Do I know the hours it adds?',
      'Do I have a price for it?',
      'Does the deadline move because of it?',
      "Is the client's yes written down (chat or email)?"] }
  };
  const CK_NAMES = { go: /go.?\/?.?no.?go|take (this|the)|accept|worth|should i/i, deliver: /deliver|final files|before (i )?send|handoff|hand.?off/i, intake: /intake|inquiry|new client|onboard/i, launch: /launch|publish|pack|listing/i, scope: /scope|extra|more work|add(itional)? (work|request)/i };
  function checkKind(text) { for (const k of ['deliver', 'intake', 'launch', 'scope', 'go']) if (CK_NAMES[k].test(text)) return k; return 'go'; }
  function checklist(st, text) {
    const k = checkKind(text), c = CHECKS[k];
    return { kind: 'chk:' + k, text: L([c.title.toUpperCase(), 'Answer each with y or n. Reply with the letters in one line, like: y n y y n y y y', '', ...c.qs.map((q, i) => `${i + 1}. ${q}`), '', `Other lists: say "delivery checklist", "intake checklist", "launch checklist" or "scope checklist".`]) };
  }
  function score(kind, text) {
    const k = kind.slice(4), c = CHECKS[k]; if (!c) return null;
    const a = (text.toLowerCase().match(/\b[yn]\b|\b(?:yes|no|ya|tidak)\b/g) || []).map(x => (x[0] === 'y' || x === 'ya') ? 'y' : 'n');
    if (a.length < c.qs.length) return `I counted ${a.length} answers but this list has ${c.qs.length}. Send them again in one line, like: ${c.qs.map((_, i) => i % 3 === 1 ? 'n' : 'y').join(' ')}`;
    const yes = a.slice(0, c.qs.length).filter(x => x === 'y').length, pctv = Math.round(yes / c.qs.length * 100);
    const gaps = c.qs.filter((q, i) => a[i] === 'n');
    const verdict = k === 'go' ? (pctv >= 80 ? 'GO. Take it.' : pctv >= 55 ? 'NEGOTIATE. Fix the gaps below first, then decide.' : 'NO-GO. Decline or re-scope.') : (pctv === 100 ? 'READY.' : 'NOT YET. Close the gaps below.');
    return L([`${c.title.toUpperCase()}`, `Score: ${yes} of ${c.qs.length} (${pctv}%). ${verdict}`, gaps.length ? '\nFix these:' : '\nNothing missing.', ...gaps.map(q => `- ${q}`), gaps.length && k === 'go' ? '\nDo not start until the price, deposit and revision limit are settled.' : null]);
  }

  /* ---- 7. guides ---- */
  const GUIDES = [

  /* ---- 8. message templates ---- */
  const TEMPLATES = [

  /* ---- 9. find anything ---- */
  const kw = t => (t.toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => w.length > 2 && !STOP.has(w));
  function find(st, text, divs) {
    const ws = kw(text); if (!ws.length) return help();
    const hits = [];
    const sc = s => ws.reduce((a, w) => a + (s.toLowerCase().includes(w) ? 1 : 0), 0);
    mine(st, divs).forEach(t => { const s = sc(t.title + ' ' + t.status + ' ' + who(t.owner)); if (s) hits.push({ s, l: `Task: ${t.title} (${t.status}, ${who(t.owner)}${t.status === 'Completed' ? '' : ', ' + when(t.due)})` }); });
    st.money.filter(m => divs.includes(m.division)).forEach(m => { const s = sc(m.desc); if (s) hits.push({ s, l: `Money: ${m.desc}, ${rpf(m.amount)} (${m.type}, ${m.status})` }); });
    st.decisions.filter(d => divs.includes(d.division)).forEach(d => { const s = sc(d.topic + ' ' + d.decision + ' ' + d.why); if (s) hits.push({ s, l: `Decision (${d.date}): ${d.decision}` }); });
    ensure(st).costs.forEach(c => { const s = sc(c.name); if (s) hits.push({ s, l: `Cost: ${c.name}, ${rpf(c.monthly)} a month` }); });
    ['goals', 'brand', 'open'].forEach(k => ((st.brain || {})[k] || '').split('\n').forEach(x => { const s = sc(x); if (s) hits.push({ s, l: `Brain, ${k}: ${x.trim()}` }); }));
    Object.values(st.threads || {}).forEach(th => (th.msgs || []).forEach(m => { if (m.from === 'joy' || m.from === 'me') return; const s = sc(m.text || ''); if (s > 1) hits.push({ s: s - 0.5, l: `${who(m.from)} said: ${(m.text || '').replace(/\s+/g, ' ').slice(0, 140)}` }); }));
    if (!hits.length) return L([`Nothing in your tasks, money, decisions, brain or chats matches "${ws.join(' ')}".`, 'Try one word, or ask for: deadlines, tasks, money, decisions, brain, calculator, checklist, guide, template.']);

    return L([`FOUND (${Math.min(hits.length, 8)} of ${hits.length}):`, ...hits.slice(0, 8).map(h => '- ' + h.l)]);

  /* ---- Joy's own database: your costs, rates and price list. It is saved inside the app's data. ---- */
  /* The starting data is the same as joy-data.json. The page tries to load that file; this copy is the fallback when it cannot. */
  const EMBEDDED = {"about": "Joy's data for Studio Board. Edit the numbers and save. To use a changed file, put it next to index.html (when the page is hosted) or press Import data in Joy's chat. Money is in rupiah (idr) and dollars (usd). Fiverr prices are the list price before fees.", "version": 1, "costs": [{"name": "Boarding house", "monthly": 500000}, {"name": "Internet", "monthly": 150000}, {"name": "Food", "monthly": 500000}, {"name": "Transportation", "monthly": 500000}, {"name": "Adobe (shared account)", "monthly": 65000}, {"name": "Laptop fund (Rp 13jt over 36 months)", "monthly": 361000}, {"name": "Other: phone, electricity, health (placeholder, replace with your real figure)", "monthly": 200000}], "settings": {"billable": 80, "workdays": 21, "savings": 20, "salary": 5000000, "fx": 16000, "fee": 20, "conv": 3, "rush": 30, "rights": 25, "source": 10, "revDays": 0.5, "openUp": 30}, "settings_help": {"billable": "billable hours you can charge for in a month", "workdays": "work days in a month", "savings": "percent of income you want to save", "salary": "monthly income goal in rupiah", "fx": "rupiah per dollar", "fee": "percent Fiverr keeps from each order", "conv": "percent lost to payout and currency conversion", "rush": "percent added for a rush deadline", "rights": "percent added for commercial rights", "source": "percent added for source files", "revDays": "work days added for each extra revision round", "openUp": "percent added to your quote for the opening ask"}, "services": [{"id": "ad", "name": "3D product ad video", "keywords": ["ad", "ads", "iklan", "promo", "advert"], "tiers": [{"tier": "Basic", "desc": "15s, 1 revision, 7 days", "idr": 1800000, "usd": 150}, {"tier": "Standard", "desc": "30s, 2 revisions, 10 days", "idr": 3200000, "usd": 300}, {"tier": "Premium", "desc": "30s plus a vertical version, 3 revisions, source file", "idr": 5500000, "usd": 550}]}, {"id": "viz", "name": "Product visualization", "keywords": ["visuali", "viz", "render", "still", "product image"], "tiers": [{"tier": "Basic", "desc": "1 hero image, 2 revisions", "idr": 1500000, "usd": 80}, {"tier": "Standard", "desc": "3 images or angles, 2 revisions", "idr": 3000000, "usd": 200}, {"tier": "Premium", "desc": "6 images plus 1 styled scene, 3 revisions", "idr": 5000000, "usd": 400}]}, {"id": "mockup", "name": "3D mockup", "keywords": ["mockup", "mock-up", "mock up"], "tiers": [{"tier": "Basic", "desc": "1 mockup", "idr": 800000, "usd": 50}, {"tier": "Standard", "desc": "3 mockups", "idr": 2000000, "usd": 120}, {"tier": "Premium", "desc": "6 mockups", "idr": 3500000, "usd": 220}]}, {"id": "explainer", "name": "Explainer / UI motion video", "keywords": ["explainer", "ui motion", "motion", "warehouse", "process video", "infographic", "video"], "tiers": [{"tier": "Basic", "desc": "30 seconds", "idr": 2500000, "usd": 250}, {"tier": "Standard", "desc": "1 minute", "idr": 4000000, "usd": 450}, {"tier": "Premium", "desc": "2 minutes", "idr": 6500000, "usd": 800}]}, {"id": "model", "name": "3D modelling", "keywords": ["model", "3d model", "asset", "prop", "character"], "note": "These 3D modelling prices are estimates from your costs, not market data. Check them against real jobs.", "tiers": [{"tier": "Basic", "desc": "1 simple model, 2 revisions", "idr": 900000, "usd": 60}, {"tier": "Standard", "desc": "1 detailed model with materials and UV, 2 revisions", "idr": 2000000, "usd": 150}, {"tier": "Premium", "desc": "3 detailed models in one style, source files, 3 revisions", "idr": 5000000, "usd": 350}]}]};
  let SRC = EMBEDDED;
  const NUMKEYS = { billable: [1, 400], workdays: [1, 31], savings: [0, 80], salary: [0, 1e9], fx: [1000, 100000], fee: [0, 60], conv: [0, 20], rush: [0, 200], rights: [0, 300], source: [0, 200], revDays: [0, 10], openUp: [0, 200] };
  const SETDEF = { billable: 80, workdays: 21, savings: 20, salary: 5000000, fx: 16000, fee: 20, conv: 3, rush: 30, rights: 25, source: 10, revDays: 0.5, openUp: 30 };
  function validate(o) {
    if (!o || typeof o !== 'object' || Array.isArray(o)) return 'This is not a Joy data file.';
    if (!Array.isArray(o.costs) || !o.costs.every(c => c && typeof c.name === 'string' && Number(c.monthly) >= 0)) return '"costs" must be a list of {"name": "...", "monthly": 0}.';
    const s = o.settings || {};
    for (const k of Object.keys(s)) { if (!NUMKEYS[k]) continue; const v = Number(s[k]); if (!(v >= NUMKEYS[k][0] && v <= NUMKEYS[k][1])) return `setting "${k}" must be a number between ${NUMKEYS[k][0]} and ${NUMKEYS[k][1]}.`; }
    if (!Array.isArray(o.services) || !o.services.length) return '"services" must be a list with at least one service.';
    const ids = new Set();
    for (const v of o.services) {

      ids.add(v.id);

      if (!Array.isArray(v.tiers) || !v.tiers.every(t => t && typeof t.tier === 'string' && Number(t.idr) >= 0 && Number(t.usd) >= 0)) return `service "${v.id}": "tiers" must be a list of {"tier", "desc", "idr", "usd"}.`;

  }
  function build(o) {
    const d = Object.assign({}, SETDEF, o.settings || {}), J = { v: 1 };

    J.services = o.services.map(v => ({ id: v.id, name: v.name, keywords: (v.keywords || []).map(String), note: v.note || '', tiers: v.tiers.map(t => ({ tier: t.tier, desc: t.desc || '', idr: Number(t.idr), usd: Number(t.usd) })) }));

  const defaults = () => build(SRC);
  function ensure(st) {

    else if (st.joy.prices && !st.joy.services) {

  }
  function exportData(st) {
    const J = ensure(st), set = {}; Object.keys(NUMKEYS).forEach(k => { set[k] = J[k]; });
    return { about: SRC.about || '', version: 1, costs: J.costs.map(c => ({ name: c.name, monthly: c.monthly })), settings: set, settings_help: SRC.settings_help || {}, services: J.services.map(v => ({ id: v.id, name: v.name, keywords: v.keywords, note: v.note || undefined, tiers: v.tiers })) };
  }
  function importData(st, o) { const e = validate(o); if (e) return { ok: false, msg: 'I could not use that file: ' + e }; st.joy = build(o); return { ok: true, msg: `Joy data loaded: ${st.joy.costs.length} costs and ${st.joy.services.length} services.` }; }
  function setDefaults(o) { if (validate(o)) return false; SRC = o; return true; }
  /* services: a keyword of 3 letters or less must match a whole word ("ad" must not match "adobe"); longer ones match the start of a word ("model" matches "modelling") */
  const svcRe = v => {
    const ws = (v.keywords && v.keywords.length ? v.keywords : [v.name]).map(w => String(w).trim().toLowerCase()).filter(Boolean)
      .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+')).map((w, i, a) => (w.length <= 3 ? '\\b' + w + '\\b' : '\\b' + w));
    return new RegExp(ws.join('|'), 'i');
  };
  const findSvc = (J, t) => { const s = J.services.find(v => svcRe(v).test(t)); return s ? s.id : null; };
  const getSvc = (J, id) => J.services.find(v => v.id === id) || null;
  const svcName = (J, id) => { const s = getSvc(J, id); return s ? s.name : 'Custom project'; };
  const keep = J => Math.max(0.3, 1 - ((J.fee || 0) + (J.conv || 0)) / 100);
  const usdf = n => '$' + Math.round(n).toLocaleString('en-US');
  const rnd = (x, s) => Math.round(x / s) * s;
  function rates(J) {
    const base = J.costs.reduce((a, c) => a + (Number(c.monthly) || 0), 0);
    const wd = J.workdays || 21, sv = Math.min(0.9, (J.savings || 0) / 100), bh = J.billable || 80;
    const survival = base / wd, healthy = base / (1 - sv) / wd, salary = (J.salary || 0) / wd, target = Math.max(salary, healthy);
    return { base, survival, healthy, target, hourS: base / bh, hourH: base / (1 - sv) / bh, hourT: target * wd / bh };
  }

  function showCosts(st) {
    const J = ensure(st), R = rates(J);
    return L(['YOUR MONTHLY COSTS:', ...J.costs.map(c => `- ${c.name}: ${rpf(c.monthly)} a month (${rpf(c.monthly * 12)} a year)`),
      `\nTotal: ${rpf(R.base)} a month, ${rpf(R.base * 12)} a year.`,
      `\nPER WORK DAY (${J.workdays} work days a month): survival ${rpf(R.survival)}, healthy ${rpf(R.healthy)} (adds ${J.savings}% savings), target ${rpf(R.target)} (matches your ${rpf(J.salary)} a month goal).`,
      `PER BILLABLE HOUR (${J.billable} billable hours a month): survival ${rpf(R.hourS)}, healthy ${rpf(R.hourH)}, target ${rpf(R.hourT)}.`,
      '\nChange it by typing:', '- set cost boarding 450k', '- add cost phone 100k', '- remove cost phone', '- set billable 70   (billable hours a month)', '- set savings 15%', '- set salary 6jt', '- set workdays 22']);
  }
  function showPackages(st, text) {
    const J = ensure(st), only = findSvc(J, text || ''), k = keep(J);
    const ids = only ? [only] : J.services.map(v => v.id);

    });
    out.push(`\nChange a price: "set price ${J.services[0].id} ${J.services[0].tiers[0].tier.toLowerCase()} indonesia 2jt" or "set price ${J.services[0].id} ${J.services[0].tiers[0].tier.toLowerCase()} fiverr 100". Services: ${J.services.map(v => v.id).join(', ')}. To add a service or edit many numbers at once, edit joy-data.json and press Import data.`);
    ids.forEach(id => { const n = getSvc(J, id).note; if (n) out.push(n); });
    return out.join('\n');
  }

  const findCost = (J, frag) => {
    const f = frag.trim().toLowerCase();
    return J.costs.find(x => x.name.toLowerCase() === f) || J.costs.find(x => x.name.toLowerCase().startsWith(f)) || J.costs.find(x => x.name.toLowerCase().includes(f));
  };
  function costNote(st) {
    const J = ensure(st), R = rates(J);

  }
  function setCmd(st, text) {
    const J = ensure(st), t = text.trim(), lo = t.toLowerCase();

    let m;

      const id = findSvc(J, m[1]); if (!id) return `Which service? Use one of: ${J.services.map(v => v.id).join(', ')}. Example: set price ${J.services[0].id} standard indonesia 3.5jt`;
      const tier = getSvc(J, id).tiers.find(x => x.tier.toLowerCase() === m[2].toLowerCase());
      if (!tier) return `${svcName(J, id)} has these packages: ${getSvc(J, id).tiers.map(x => x.tier).join(', ')}. Example: set price ${id} ${getSvc(J, id).tiers[0].tier.toLowerCase()} indonesia 2jt`;
      const v = money(m[4]);
      if (!v) return 'I need an amount at the end, like 3.5jt or 350.';
      const fv = /fiverr|international|usd|dollar/i.test(m[3]);

      return `Done. ${svcName(J, id)}, ${tier.tier}, ${fv ? 'Fiverr' : 'Indonesia'}: ${fv ? usdf(tier.usd) : rpf(tier.idr)}.`;
    }
    if ((m = /^(?:add|new)\s+cost\s+(.+?)\s+(\S+)$/i.exec(t))) {

      J.costs.push({ id: 'c' + Date.now().toString(36), name: m[1].trim().replace(/^./, c => c.toUpperCase()), monthly: v });

    }
    if ((m = /^(?:set|change|update)\s+cost\s+(.+?)\s+(\S+)$/i.exec(t))) {

      c.monthly = v; return `Updated ${c.name}: ${rpf(v)} a month.\n` + costNote(st);
    }
    if ((m = /^(?:remove|delete)\s+cost\s+(.+)$/i.exec(t))) {

    }
    const one = [
      [/^set\s+(?:billable(?: hours)?|hours)\s+(?:to\s+)?(\d+(?:[.,]\d+)?)/i, 'billable', 'billable hours a month', 1, 400],
      [/^set\s+(?:workdays|work days|days)\s+(?:to\s+)?(\d+)/i, 'workdays', 'work days a month', 1, 31],
      [/^set\s+savings\s+(?:to\s+)?(\d+(?:[.,]\d+)?)/i, 'savings', 'percent savings', 0, 80],
      [/^set\s+fx\s+(?:to\s+)?(\d[\d.,]*)/i, 'fx', 'rupiah per dollar', 1000, 100000],
      [/^set\s+fee\s+(?:to\s+)?(\d+(?:[.,]\d+)?)/i, 'fee', 'percent Fiverr fee', 0, 60],
      [/^set\s+conv(?:ersion)?\s+(?:to\s+)?(\d+(?:[.,]\d+)?)/i, 'conv', 'percent conversion and payout cost', 0, 20],
      [/^set\s+rush\s+(?:to\s+)?(\d+(?:[.,]\d+)?)/i, 'rush', 'percent rush fee', 0, 200],
      [/^set\s+rights\s+(?:to\s+)?(\d+(?:[.,]\d+)?)/i, 'rights', 'percent for commercial rights', 0, 300],
      [/^set\s+source\s+(?:to\s+)?(\d+(?:[.,]\d+)?)/i, 'source', 'percent for source files', 0, 200],
      [/^set\s+revisions?\s+(?:to\s+)?(\d+(?:[.,]\d+)?)/i, 'revDays', 'work days per extra revision', 0, 10],
      [/^set\s+opening\s+(?:to\s+)?(\d+(?:[.,]\d+)?)/i, 'openUp', 'percent added to your opening ask', 0, 200]
    ];
    for (const [re, key, label, lo2, hi] of one) {
      const x = re.exec(t); if (!x) continue;
      const v = key === 'fx' ? num(x[1]) : Number(x[1].replace(',', '.'));
      if (!(v >= lo2 && v <= hi)) return `${label}: please give a number between ${lo2} and ${hi}.`;
      J[key] = v; return `Done. ${label}: ${v}.\n\n` + (['billable', 'workdays', 'savings'].includes(key) ? costNote(st) : 'Rates and prices will use it from now on.');
    }
    if ((m = /^set\s+salary\s+(?:to\s+)?(.+)$/i.exec(t))) { const v = money(m[1]); if (!v) return 'Give an amount, like: set salary 6jt'; J.salary = v; return `Done. Monthly income goal: ${rpf(v)}.\n` + costNote(st); }
    return L(['I did not understand that setting. You can type:', '- set cost boarding 450k  |  add cost phone 100k  |  remove cost phone', '- set billable 70  |  set workdays 22  |  set savings 15%  |  set salary 6jt', '- set fx 16500  |  set fee 20  |  set conv 3', '- set rush 30  |  set rights 25  |  set source 10  |  set revisions 0.5', '- set price ad standard indonesia 3.5jt  |  set price model basic fiverr 70']);
  }

  /* ---- pricing calculator: a short chat that asks service, work days and extras ---- */
  const num2 = s => Number(String(s).replace(',', '.'));
  function parseDays(t, plain) {
    let m = /(\d+(?:[.,]\d+)?)\s*(?:weeks?|wks?|minggu)\b/i.exec(t); if (m) return num2(m[1]) * 5;
    m = /(\d+(?:[.,]\d+)?)\s*(?:work(?:ing)?\s*)?(?:days?|hari)\b/i.exec(t); if (m) return num2(m[1]);
    m = /(\d+(?:[.,]\d+)?)\s*(?:hours?|hrs?|jam|h)\b/i.exec(t); if (m) return num2(m[1]) / 8;
    if (plain) { m = /^\s*(\d+(?:[.,]\d+)?)\s*$/.exec(t); if (m) return num2(m[1]); }
    return null;
  }
  function findBudget(t) {
    let m = /(?:budget|offers?|offering|pays?|paying|client has|they have)\s*(?:of|is|at|=|:)?\s*(\$|rp\.?)?\s*(\d[\d.,]*\s*(?:jt|juta|million|mil|rb|ribu|k|m)?)(?![a-z])\s*(usd|dollars?)?/i.exec(t);
    if (m) { const v = money(m[2]); return v ? { v, usd: m[1] === '$' || !!m[3] } : null; }
    m = /\$\s*(\d[\d.,]*)\s*(?:k)?\s*budget/i.exec(t); if (m) { const v = money(m[1]); return v ? { v, usd: true } : null; }
    return null;
  }
  function absorb(J, text, p, step) {
    const t = text.toLowerCase();
    if (!p.svc) {
      const s = findSvc(J, t);
      if (s) p.svc = s;
      else if (step === 'svc') { const m = /^\s*(\d{1,2})\b/.exec(t), ids = J.services.map(v => v.id).concat(['other']); if (m && Number(m[1]) >= 1 && Number(m[1]) <= ids.length) p.svc = ids[Number(m[1]) - 1]; else if (/\b(other|custom|something else)\b/.test(t)) p.svc = 'other'; }
    }
    if (p.days == null) { const d = parseDays(t, step === 'days'); if (d) p.days = d; }
    if (/\b(rush|urgent|asap|express)\b/.test(t)) p.rush = 1;
    if (/\b(commercial|rights|exclusive|ownership|license|licence)\b/.test(t)) p.rights = 1;
    if (/\b(source|project files?|raw files?|editable)\b/.test(t)) p.source = 1;
    const rv = /(\d+)\s*(?:extra|more|additional)?\s*revisions?/.exec(t); if (rv) p.revs = Number(rv[1]);
    if (/\b(indonesia|local|rupiah|idr)\b/.test(t)) p.market = 'id';
    if (/\b(fiverr|international|overseas|global)\b/.test(t)) p.market = p.market === 'id' ? 'both' : 'fv';
    const b = findBudget(t); if (b) p.budget = b;
    if (step === 'ex') p.ex = 1;
  }
  const askSvc = J => L(['PRICE CHECK. What is the project?', ...J.services.map((v, i) => `${i + 1}. ${v.name}`), `${J.services.length + 1}. Something else`, `Answer with a number or a few words. Or do it all in one line, like: pricing ${J.services[0].id} 7 days fiverr rush budget 2jt`]);
  const ASK = {
    days: 'How many work days will it take you in total, revisions included? You can say "6 days", "1.5 weeks" or "40 hours".',
    ex: L(['Anything that changes the price? Say any of these, or "none":', '- rush (short deadline)', '- commercial rights, or source files', '- 2 extra revisions', '- indonesia or fiverr (I show both if you skip this)', '- budget 2jt (what the client offers, I tell you go, negotiate or no)'])
  };
  function priceResult(st, p) {
    const J = ensure(st), R = rates(J), k = keep(J);
    const days = p.days + (p.revs || 0) * (J.revDays || 0.5);
    const mult = 1 + ((p.rush ? J.rush : 0) + (p.rights ? J.rights : 0) + (p.source ? J.source : 0)) / 100;
    const floor = rnd(R.survival * days * (1 + (p.rush ? J.rush : 0) / 100), 10000);
    const healthy = rnd(R.healthy * days * mult, 50000);
    const quote = Math.max(rnd(R.target * days * mult, 50000), healthy);
    const open = rnd(quote * (1 + (J.openUp || 30) / 100), 50000);
    const x = [p.rush ? 'rush' : '', p.rights ? 'commercial rights' : '', p.source ? 'source files' : '', p.revs ? p.revs + ' extra revisions' : ''].filter(Boolean);
    const out = [`PRICE CHECK: ${svcName(J, p.svc)}, ${r1(days)} work days${x.length ? ' (' + x.join(', ') + ')' : ''}`, `Your rates per work day: floor ${rpf(R.survival)}, healthy ${rpf(R.healthy)}, target ${rpf(R.target)}.`];
    const usd = rp => rp / J.fx / k;
    if (p.market !== 'fv') out.push('', 'INDONESIA (rupiah, your agency site):', `- Floor: ${rpf(floor)}. Below this you lose money.`, `- Healthy: ${rpf(healthy)}. Covers your costs and ${J.savings}% savings.`, `- Quote: ${rpf(quote)}. Matches your ${rpf(J.salary)} a month goal.`, `- Opening ask: ${rpf(open)}. Start here and leave room to negotiate.`);
    if (p.market !== 'id') out.push('', `FIVERR (list price in dollars; you keep about ${Math.round(k * 100)}% after fees):`, `- Floor: ${usdf(usd(floor))}  |  Quote: ${usdf(usd(quote))}  |  Opening: ${usdf(usd(open))}`, `- At the quote you keep about ${rpf(quote)}. New sellers with no reviews often start 20 to 30% lower and raise it later.`);
    const tiers = getSvc(J, p.svc) && getSvc(J, p.svc).tiers.length ? getSvc(J, p.svc).tiers : null;
    if (tiers) {
      const near = tiers.reduce((a, t) => Math.abs(t.idr - quote) < Math.abs(a.idr - quote) ? t : a, tiers[0]);
      out.push('', `YOUR PRICE LIST for this: ${tiers.map(t => `${t.tier} ${rpf(t.idr)} / ${usdf(t.usd)}`).join(', ')}.`, quote < tiers[0].idr ? `Your day-based quote is below your Basic package (${rpf(tiers[0].idr)}). Packages are priced on what the work is worth, not only your days, so the Basic price is fine if it suits the job.` : quote > tiers[tiers.length - 1].idr ? 'Your quote is above your Premium package. That is a custom job, so quote it as custom.' : `Closest package: ${near.tier} (${near.desc}).`);
    }
    if (p.budget) {
      const net = p.budget.usd ? p.budget.v * J.fx * k : p.budget.v, dTarget = net / (R.target * mult), dHealthy = net / (R.healthy * mult);
      out.push('', `CLIENT BUDGET: ${p.budget.usd ? usdf(p.budget.v) + ' (about ' + rpf(net) + ' after fees)' : rpf(p.budget.v)}`);
      if (net < floor) out.push(`- NO. It is below your floor of ${rpf(floor)}. Do not take it as scoped.`, `- To make it work, cut the scope to about ${r1(dHealthy)} work days, or decline.`);
      else if (net < quote) out.push(`- NEGOTIATE. It covers your floor but not your quote of ${rpf(quote)}.`, `- Counter at ${rpf(quote)}, or keep their budget and cut the scope to about ${r1(dTarget)} work days.`);
      else out.push('- GO. It meets your quote. Confirm scope, revisions and a 50% deposit before you start.');
    }
    out.push('', 'The days you gave are your own estimate, and the price is only as good as that estimate. Compare it with your price list before you send it. Say "pricing" to do another.');
    return out.join('\n');
  }
  function pricing(st, text, prevKind) {
    const J = ensure(st);
    let p = {}, step = null;
    if (prevKind) { try { p = JSON.parse(prevKind.slice(3)); } catch (e) { p = {}; } step = !p.svc ? 'svc' : p.days == null ? 'days' : 'ex'; }
    if (prevKind && /^\s*(cancel|stop|exit|never ?mind|quit|batal)\s*$/i.test(text)) return { text: 'Okay, price check cancelled. Say "pricing" any time.', kind: '' };
    const before = JSON.stringify(p);
    absorb(J, text, p, step);
    if (!prevKind && p.svc && p.days != null) p.ex = 1;
    const kind = o => 'pq:' + JSON.stringify(o);
    if (!p.svc) return { text: (prevKind && before === JSON.stringify(p) ? 'I did not catch the project. ' : '') + askSvc(J), kind: kind(p) };
    if (p.days == null) return { text: (prevKind && step === 'days' && before === JSON.stringify(p) ? 'I did not catch the days. ' : '') + ASK.days, kind: kind(p) };
    if (!p.ex) return { text: ASK.ex, kind: kind(p) };
    return { text: priceResult(st, p), kind: '' };
  }

  /* ---- help and routing ---- */
  function help() {
    return L(['I am Joy. I never use an AI, so I cost no quota and always answer. I read your Board, Money, Decisions and Studio brain. Ask me:',
      '- "deadlines" or "what is overdue"',
      '- "tasks", "tasks for Mira", "what is in review"',
      '- "money", "who owes me", "profit"',
      '- "decisions", "decisions about pricing"',
      '- "brain" or "goals"',
      '- "pricing" (what to charge for a project: floor, quote and opening price, in rupiah and dollars)',
      '- "price list" (your packages for Indonesia and Fiverr), "my costs" (monthly and yearly spend and your rates)',
      '- "set cost boarding 450k", "set billable 70", "set price ad standard fiverr 350" (change my saved numbers)',
      '- "price 6jt cost 1.5jt hours 30" (quick calculator)',
      '- "30 hours in 10 days" (does it fit?)',
      '- "checklist", "delivery checklist", "intake checklist"',
      '- "guide revisions", "guide late payment"',
      '- "template decline", "template payment reminder"',
      '- any word, and I search everything: "halloween", "client a"',
      '- chat with me: I answer from a database you can teach: "teach: question => answer", "teachings", "forget 3"',
      'Add "agency", "creative" or "both" to choose a division.']);
  }
  const MONEYW = /\b(money|invoice|income|expenses?|payment|paid|owe|owes|owed|profit|revenue|payout|cash|earn(?:ed|ings)?|received|balance|cuts?)\b/i;
  const hasNum = t => /\d/.test(t);
  function route(text, skill) {
    const s = skill ? skill.toLowerCase() : '';
    if (s === 'deadlines') return 'deadlines';
    if (s === 'task status') return 'tasks';
    if (s === 'money snapshot') return 'money';
    if (s === 'calculator') return 'calc';
    if (s === 'workload check') return 'workload';
    if (s === 'checklist') return 'check';
    if (s === 'guide') return 'guide';
    if (s === 'message template') return 'template';
    if (s === 'find') return 'find';
    if (s === 'pricing') return 'pricing';
    if (s === 'price list') return 'packages';
    if (s === 'my costs') return 'costs';
    const t = text.toLowerCase().trim();
    if (/^\s*(?:set|change|update|add|new|remove|delete)\s+(?:cost|price|billable|hours|workdays|work days|days|savings|salary|fx|fee|conv|conversion|rush|rights|source|revisions?|opening)\b/.test(t)) return 'set';
    if (/^\s*reset joy( data)?\b/.test(t)) return 'reset';
    if (/\b(joy data|joy-data|json|import data|export data|import joy|export joy)\b/.test(t)) return 'data';
    if (!t || /^(help|menu|what can you do|\?|hi|hello|hey|halo)\b/.test(t)) return 'help';
    if (/\b(template|draft (?:a |the )?(?:message|reply)|write (?:a |the )?message|how (?:do|to|should) i (?:say|tell|ask)|wording)\b/.test(t) || /\b(decline|turn down|polite)/.test(t) && /\b(client|job|message|reply)\b/.test(t)) return 'template';
    if (/\b(checklist|check ?list|go.?\/?.?no.?go|should i (?:take|accept)|worth (?:it|taking))\b/.test(t)) return 'check';
    if (/\b(guide|how (?:do|to|should) i|steps? (?:to|for)|process for|playbook)\b/.test(t)) return 'guide';
    if (/\b(pricing|price (?:a|this|my|it|check)|what should i (?:charge|quote)|how much (?:should|do) i (?:charge|quote|price)|custom orders?|quote (?:a|this|the) (?:project|job|order)|project price)\b/.test(t)) return 'pricing';
    if (/\b(my costs?|monthly costs?|base costs?|living costs?|annual|per year|yearly|monthly spend|my spending|what do i spend|my rates?|day rate|daily rate|joy settings|my numbers)\b/.test(t)) return 'costs';
    if (/\b(price ?list|packages?|packs?|rate ?card|my prices)\b/.test(t)) return 'packages';
    if (/\b(workload|overbooked|capacity|enough time|fit (?:in|my)|per day)\b/.test(t) || (hours(t) && days(t) && !/\b(price|rate|cost)/.test(t))) return 'workload';
    if (/\b(calc|calculate|calculator|margin|hourly|per hour|hitung|payout after|take home|net)\b/.test(t) || (hasNum(t) && /\b(price|quote|cost|rate|fee|deposit|harga|biaya|hours?|jam|dp)\b/.test(t))) return 'calc';
    if (MONEYW.test(t)) return 'money';
    if (/\b(deadlines?|due|overdue|late|today|tomorrow|this week|next week|upcoming|behind|urgent|terlambat|jatuh tempo)\b/.test(t)) return 'deadlines';
    if (/\b(tasks?|board|status|progress|review|in progress|todo|to do|backlog|approved|proposed|completed|who has|owns)\b/.test(t)) return 'tasks';
    if (/\b(decisions?|decided|revisit|why did we)\b/.test(t)) return 'decisions';
    if (typeof ROLES !== 'undefined' && ROLES.some(r => r.id !== 'joy' && new RegExp('\\b' + r.name + '\\b', 'i').test(text))) return 'tasks';
    if (/\b(brain|goals?|brand|open questions?|budget|studio style)\b/.test(t)) return 'brain';
    return 'find';
  }

  /* ctx: { division, lastKind }. Returns { text, kind }. */
  function reply(st, text, skill, ctx) {
    text = String(text || ''); ctx = ctx || {};
    try {
      if (ctx.lastKind && /^chk:/.test(ctx.lastKind) && !skill && /^[\s,;.ynyesotidakya]+$/i.test(text) && (text.toLowerCase().match(/\b(?:y|n|yes|no|ya|tidak)\b/g) || []).length >= 3) {
        const r = score(ctx.lastKind, text); if (r) return { text: r, kind: '' };
      }
      if (ctx.lastKind && /^pq:/.test(ctx.lastKind) && !skill) {
        const r0 = route(text, '');
        const strong = !['find', 'brain', 'calc', 'workload', 'pricing', 'money'].includes(r0);
        const wiz = /^\s*(none|no|nothing|skip|ok|okay|n|cancel|stop|exit|quit|batal)\s*$/i.test(text) || !strong || /\b(rush|commercial|rights|source|revisions?|indonesia|fiverr|budget|days?|weeks?|hours?)\b/i.test(text);
        if (wiz) return pricing(st, text, ctx.lastKind);
      }
      const divs = divsFor(st, text), r = route(text, skill);
      switch (r) {
        case 'help': return { text: help(), kind: '' };
        case 'set': return { text: setCmd(st, text), kind: '' };
        case 'reset': if (/confirm/i.test(text)) { st.joy = defaults(); return { text: 'Joy data reset to the starting values.\n' + costNote(st), kind: '' }; } return { text: 'This replaces your costs, settings and price list with the starting values from joy-data.json. To go ahead, type: reset joy data confirm. Tip: press Export data first if you want a copy.', kind: '' };
        case 'data': return { text: 'Joy\'s data lives in joy-data.json. Use the Export data button above the message box to download your current numbers, and Import data to load a file. If the page is hosted next to joy-data.json, it loads that file the first time you open it.', kind: '' };
        case 'pricing': return pricing(st, text, '');
        case 'costs': return { text: showCosts(st), kind: '' };
        case 'packages': return { text: showPackages(st, text), kind: '' };
        case 'deadlines': return { text: deadlines(st, text, divs), kind: '' };
        case 'tasks': return { text: tasks(st, text, divs), kind: '' };
        case 'money': return { text: moneyView(st, text, divs), kind: '' };
        case 'decisions': return { text: decisions(st, text, divs), kind: '' };
        case 'brain': return { text: brain(st), kind: '' };
        case 'calc': return { text: calc(st, text), kind: '' };
        case 'workload': return { text: workload(st, text, divs), kind: '' };
        case 'check': { const c = checklist(st, text); return { text: c.text, kind: c.kind }; }
        case 'guide': return { text: guide(st, text), kind: '' };
        case 'template': return { text: template(st, text), kind: '' };
        default: return { text: find(st, text, divs), kind: '' };
      }
    } catch (e) {

    }
  }

const ACT_V3 = {
  'ai-open'() { openAI(); },
  'ai-close'() { closeAI(); },
  'ai-add'() {
    const used = ai.keys.map(k => k.provider), next = ['claude', 'gemini', 'grok', 'groq', 'custom'].find(p => !used.includes(p)) || 'gemini';
    const k = { id: uid(), provider: next, label: '', key: '', model: PROVS[next].model, base: '', status: 'idle', msg: '', models: [] };
    ai.keys.push(k); saveAI();

  },
  'ai-del'(el) {

  'ai-show'(el) {
    const k = findKey(el.dataset.id), inp = k && document.querySelector(`[data-ai="${k.id}:key"]`); if (!inp) return;
    const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; el.textContent = show ? 'Hide' : 'Show';
  },
  'ai-test'(el) { runTest(el.dataset.id); },
  'reply-ask'(el) {
    const key = threadKey(), th = getThread(), p = th.pending.find(x => x.id === el.dataset.id); if (!p) return;
    const sel = el.parentElement.querySelector('select'), k = sel ? findKey(sel.value) : null;
    p.manual = false; p.err = ''; delete p.state; save();
    runOne(key, p, k && hasKey(k) ? k : undefined);
  },
  'reply-stop'(el) { stopPending(el.dataset.id); },
  'reply-add'(el) {
    const box = el.closest('.pend'), text = box.querySelector('textarea').value.trim();
    if (!text) { toast("Paste the AI's reply first."); return; }
    const key = threadKey(), th = getThread(), i = th.pending.findIndex(x => x.id === el.dataset.id); if (i < 0) return;
    const p = th.pending.splice(i, 1)[0]; stopPending(p.id);
    addReply(th, p.role, text, null, stepName());
    delete drafts[p.id]; save(); viewRefresh(key);
  },
  'reply-skip'(el) {
    const th = getThread(); stopPending(el.dataset.id);
    th.pending = th.pending.filter(x => x.id !== el.dataset.id); delete drafts[el.dataset.id]; save(); viewRefresh(threadKey());
  },
  'msg-del'(el) {
    const th = getThread();
    th.pending.filter(x => x.msgId === el.dataset.id).forEach(x => stopPending(x.id));
    th.msgs = th.msgs.filter(x => x.id !== el.dataset.id); th.pending = th.pending.filter(x => x.msgId !== el.dataset.id); save(); viewRefresh(threadKey());
  },
  'chat-clear'() {
    if (confirm('Clear this whole conversation?')) { const t = getThread(); t.pending.forEach(x => stopPending(x.id)); t.msgs = []; t.pending = []; save(); render(); }
  },
  'msg-apply'(el) {
    const th = getThread(), m = th.msgs.find(x => x.id === el.dataset.id); if (!m) return;
    const D = chatDiv(); let n = 0;
    (m.actions || []).forEach(a => {
      if (a.state !== 'proposed') return;
      if (a.skip) { a.state = 'dismissed'; return; }
      const r = applyOne(a, D, m.from);
      if (r.ok) { a.state = 'applied'; a.undo = r.undo; n++; } else { a.state = 'failed'; a.reason = r.reason; }
    });
    save(); refreshThread(); renderTree(); toast(n ? `Added ${n} ${n === 1 ? 'change' : 'changes'} to the board` : 'Nothing was added');
  },
  'msg-dismiss'(el) {
    const m = getThread().msgs.find(x => x.id === el.dataset.id); if (!m) return;
    (m.actions || []).forEach(a => { if (a.state === 'proposed') a.state = 'dismissed'; });
    save(); refreshThread();
  },
  'msg-undo'(el) {
    const m = getThread().msgs.find(x => x.id === el.dataset.id); if (!m) return;
    let n = 0; (m.actions || []).slice().reverse().forEach(a => { if (a.state === 'applied') { undoOne(a.undo); a.state = 'undone'; n++; } });
    save(); refreshThread(); renderTree(); toast(n ? 'Undone' : 'Nothing to undo');
  },
  'data-clear'() {
    if (confirm('Clear the board, chats, decisions and brain saved in this browser? Your API keys are kept; remove them in the AI popup. Back up first if you want to keep your data.')) {
      Object.keys(state.threads).forEach(k => state.threads[k].pending.forEach(x => stopPending(x.id)));
      state = blank(); save(); render(); toast('Cleared');
    }
  },
  'data-clear-sample'() {
    Object.keys(state.threads).forEach(k => state.threads[k].pending.forEach(x => stopPending(x.id)));
    state.tasks = []; state.money = []; state.decisions = []; state.threads = {}; state.brain = { goals: '', brand: '', open: '' }; state.sample = false;
    save(); render();
  }
};

function limitState(l) {

}

  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);

function copyText(text, msg) {
  const done = () => toast(msg || 'Copied');
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Could not copy. Select the text and copy it by hand.'); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
const cycle = (arr, v) => arr[(arr.indexOf(v) + 1) % arr.length];

const forms = {

    if (STATUSES.includes(d.get('status'))) t.status = d.get('status'); t.due = validDate(d.get('due') || '') ? d.get('due') : ''; t.note = (d.get('note') || '').trim().slice(0, 400);

  },

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = act[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const fn = forms[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.brain) {
    state.brain[t.dataset.brain] = t.value; save();
    const b = state.brain, n = tokens(b.goals + b.brand + b.open), s = $('#brainSize');
    if (s) { s.textContent = `About ${n} tokens${n > 1500 ? '. Trim it to save your free messages.' : '.'}`; s.className = 'small ' + (n > 1500 ? 'warn' : 'muted'); }
    return;
  }
  if (t.id === 'cText') { drafts['c:' + threadKey()] = t.value; return; }
  if (t.dataset && t.dataset.draft) { drafts[t.dataset.draft] = t.value; return; }
  if (t.dataset && t.dataset.threadTitle !== undefined) { getThread().title = t.value; save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.lim) {
    const l = state.limits[t.dataset.lim], v = t.value === '' ? null : Math.max(0, Number(t.value));
    if (t.dataset.field === 'cap') l.cap = v; else l.hours = Math.max(1, v || 1);
    save(); const box = $('#limits'); if (box) box.innerHTML = limitsHtml(); return;
  }
  if (t.id === 'fileIn') {
    const file = t.files && t.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data || typeof data !== 'object' || !Array.isArray(data.tasks)) throw new Error('bad file');
        state = healPending(Object.assign(blank(), data, { sample: false })); save(); render(); toast('Backup restored');
      } catch (err) { toast('That file is not a Studio Board backup.'); }
      t.value = '';
    };
    rd.readAsText(file); return;
  }
  if (t.id === 'cFile') { addFiles([...t.files]); t.value = ''; return; }
  const c = state.chat;
  if (t.id === 'cTo') { c.to = t.value; c.skill = ''; save(); render(); return; }
  if (t.id === 'cSkill') { c.skill = t.value; save(); render(); return; }
  if (t.id === 'cN') { c.n = Number(t.value) || 10; save(); render(); return; }
  if (t.id === 'cBrain') { c.incBrain = t.checked; save(); render(); return; }
  if (t.id === 'cDec') { c.incDec = t.checked; save(); render(); return; }
  if (t.id === 'cTasks') { c.incTasks = t.checked; save(); render(); return; }
  if (t.id === 'cJoy') { c.incJoy = t.checked; save(); render(); return; }
  if (t.dataset && t.dataset.stepName) {
    const st = stepsFor(chatDiv()).find(x => x.id === t.dataset.stepName);
    if (st) { st.name = t.value.trim() || st.name; save(); }
    return;
  }
  if (t.dataset && t.dataset.stepMember) {
    const parts = t.dataset.stepMember.split(':'), st = stepsFor(chatDiv()).find(x => x.id === parts[0]); if (!st) return;
    if (t.checked) { if (!st.members.includes(parts[1])) st.members.push(parts[1]); }
    else if (st.members.length > 1) st.members = st.members.filter(x => x !== parts[1]);
    else { t.checked = true; toast('A step needs at least one person.'); }
    save();
  }
});
document.addEventListener('paste', e => {
  if (e.target.id !== 'cText') return;
  const fs = [...((e.clipboardData && e.clipboardData.items) || [])].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (fs.length) { e.preventDefault(); addFiles(fs); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.cutin) { e.preventDefault(); act['cut-add']({ dataset: { id: e.target.dataset.cutin } }); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'cText') { e.preventDefault(); sendMessage(e.target.value); }
});
window.addEventListener('hashchange', () => {
  const v = location.hash.replace('#', '');
  if (RENDER[v] && v !== state.view) { state.view = v; save(); render(); }
});
setInterval(() => { if (state.view === 'overview') refreshLimits(); }, 30000);

/* ---------- start ---------- */
(() => { const v = location.hash.replace('#', ''); if (RENDER[v]) state.view = v; })();
render();
probeAvatars();
})();
</script>
